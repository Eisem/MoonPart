name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, build, test, and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s 0.10.20+65efd5b93
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Check every supported backend
        run: moon check --target all

      - name: Build every supported backend
        run: moon build --target all

      - name: Test every supported backend
        run: moon test --target all

      - name: Analyze coverage
        run: moon coverage analyze
